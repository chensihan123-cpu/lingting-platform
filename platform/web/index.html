<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵听 · 生态声学监测平台</title><link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/map.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="#overview"><span class="brand-icon">≋</span><span>灵听<small>LINGTING OBSERVATORY</small></span></a><div class="nav-caption">生态声学工作台</div><nav id="nav"></nav><div class="sidebar-bottom"><span class="dot"></span> 本地工作空间<small>PC 验证版 · 数据保存在本机</small><div class="version">FIELD SYSTEM / 0.2</div></div></aside>
<div class="workspace"><header class="topbar"><span>灵听智能终端 <span class="slash">/</span> <span id="breadcrumb">监测总览</span></span><div><span class="connection" id="connection">连接中</span><span id="clock"></span></div></header>
<main><div class="page-heading"><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="subtitle"></p></div><button class="primary" id="new-audio">＋ 上传 / 采集录音</button></div><div id="content"></div></main>
<footer><span>LINGTING · 让每一段声音，有迹可循</span><span id="model-status">AST / AudioSet 527 类</span></footer></div>
<dialog id="upload-dialog"><form id="upload-form"><div class="dialog-head"><div><p class="eyebrow">NEW OBSERVATION</p><h2>采集一段声音</h2></div><button type="button" class="icon-button close">×</button></div><label>关联终端<select name="device_id" id="upload-device"></select></label><div class="upload-zone"><span class="upload-symbol">↥</span><b>选择本地音频</b><p>WAV / MP3 / M4A 等浏览器支持的格式 · 最长120秒</p><input type="file" id="audio-file" accept="audio/*"></div><div class="split"><label>场景触发阈值<input name="threshold" type="number" min="0.05" max="1" step="0.05" value="0.25" required></label><label>采集时间（可留空）<input type="datetime-local" name="captured_at"></label></div><p class="muted">录音将保存到本机平台，由本地 AST 分析。原始预测和人工复核结论分开保存。</p><div class="actions"><button type="button" id="record">● 录制10秒</button><button type="submit" class="primary" id="upload-submit">上传并识别</button></div><p id="upload-progress" role="status"></p></form></dialog>
<dialog id="detail-dialog"><div id="detail-content"></div></dialog>
<dialog id="device-dialog"><form id="device-form"><div class="dialog-head"><h2>登记监测终端</h2><button type="button" class="icon-button close">×</button></div><label>设备编号<input name="id" required maxlength="64" placeholder="如 lt-001"></label><label>终端名称<input name="name" required maxlength="80" placeholder="如 林地北侧监测站"></label><div class="split"><label>纬度<input type="number" name="lat" min="-90" max="90" step="any"></label><label>经度<input type="number" name="lon" min="-180" max="180" step="any"></label></div><label class="inline"><input type="checkbox" name="simulated"> 这是模拟终端</label><p class="muted">登记不会使设备变为在线，终端需发送心跳或上传录音。坐标为空时不会显示在地图上。</p><button class="primary" type="submit">登记终端</button></form></dialog>
<div id="toast" role="status" hidden></div><script src="/vendor/leaflet.js"></script><script src="/map.js"></script><script type="module" src="/app.js"></script></body></html>
